<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#11151d">
	<title>Para Katherine</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="phone-screen" id="phone">
		<section class="lock-screen" id="lockScreen" aria-label="Pantalla de bloqueo">
			<div class="clock" aria-label="12:00 PM">
				<div class="time">12:00</div><div class="period">PM</div>
				<div class="route">Alemania — Perú</div>
			</div>
			<div class="belongs">Este celular le pertenece a<strong>Katherine</strong></div>
			<div class="swipe-hint" aria-label="Desliza hacia arriba para abrir"><span class="chevron">⌃</span><span>Desliza para abrir</span></div>
		</section>
		<section class="password-screen" id="passwordScreen" aria-label="Introducir contraseña" aria-hidden="true">
			<div class="avatar" aria-hidden="true">K</div>
			<h1 class="greeting">Katherine</h1>
			<p class="prompt">Introduce tu contraseña</p>
			<p class="password-hint">(¿Cómo me llamo? jeje)</p>
			<form class="password-form" id="passwordForm">
				<input class="password-input" id="password" type="password" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña" required>
				<button type="submit">Continuar</button>
				<div class="message" id="message" role="status" aria-live="polite"></div>
				<div class="secret-hint" id="secretHint" aria-hidden="true">Psst... es Jeremy.</div>
			</form>
			<div class="back-hint">Desliza hacia abajo para volver</div>
		</section>
		<section class="home-screen" id="homeScreen" aria-label="Pantalla principal" aria-hidden="true"></section>
		<section class="app-screen" id="appScreen" aria-hidden="true"></section>
	</main>
	<template id="constellationTemplate">
		<div class="constellation-app">
			<div class="constellation-scene" data-constellation-scene>
				<div class="constellation-art" data-constellation-art>
					<img class="constellation-base" src="imagenes/fondo de mapa sin estrellas.png" data-constellation-base alt="Escena bajo el cielo sin estrellas">
					<img class="constellation-final" src="imagenes/fondo de mapa con estrellas.png" alt="Escena bajo el cielo estrellado">
					<div class="constellation-stars" data-constellation-stars aria-hidden="true"></div>
				</div>
			</div>
		</div>
	</template>
	<template id="musicTemplate">
		<div class="music-app">
			<div class="music-intro">
				<div class="playlist-cover-frame"><img class="playlist-cover" data-playlist-cover alt="Portada de la playlist"></div>
				<div class="playlist-copy">
					<span class="music-eyebrow">PLAYLIST PERSONAL</span>
					<h3 data-playlist-title></h3>
					<p data-playlist-description></p>
					<small data-playlist-meta></small>
				</div>
			</div>
			<div class="music-actions">
				<button class="music-play-all" type="button" data-play-all><span class="music-play-symbol" aria-hidden="true">▶</span><span>Reproducir</span></button>
				<button class="music-shuffle" type="button" data-shuffle aria-label="Reproducción aleatoria" title="Reproducción aleatoria">⤨</button>
			</div>
			<div class="music-track-list" data-track-list></div>
			<div class="music-status" data-music-status role="status" aria-live="polite">Elige una canción</div>
		</div>
	</template>
	<template id="petTemplate">
		<div class="pet-game">
			<div class="pet-hud"><span>MI MASCOTA</span><div class="pet-hud-values"><span class="pet-coins"><b aria-hidden="true">🪙</b> <strong data-pet-coins>120</strong></span><span class="pet-affection">Cariño <b aria-hidden="true">♡</b> <strong data-pet-affection>0</strong></span></div></div>
			<div class="pet-room">
				<div class="pet-window"><span></span><i></i><b></b></div>
				<div class="pet-shelf"><span></span><span></span><span></span></div>
				<div class="pet-plant"><i></i><i></i><b></b></div>
				<div class="pet-lamp"><i></i><b></b></div>
				<div class="pet-rug"></div>
				<button class="pet-character" type="button" data-pet-character aria-label="Acariciar al gatito">
					<span class="pet-hearts" aria-hidden="true"></span>
					<svg class="pet-cat-visual" viewBox="0 0 240 260" role="img" aria-label="Gatito negro">
						<path class="cat-tail" d="M151 194c49 18 62-18 42-35-11-10-24-5-22 5" />
						<ellipse class="cat-body" cx="119" cy="190" rx="54" ry="48" />
						<g class="cat-body-stripes" aria-hidden="true"><path d="M83 157q8 8 17 10M76 177q11 10 23 12M81 197q9 8 20 9M155 157q-8 8-17 10M162 177q-11 10-23 12M157 197q-9 8-20 9" /></g>
						<path class="cat-belly" d="M87 196c8-20 49-22 63 0 9 14-2 27-31 27s-40-12-32-27Z" />
						<ellipse class="cat-paw" cx="89" cy="226" rx="20" ry="11" />
						<ellipse class="cat-paw" cx="148" cy="226" rx="20" ry="11" />
						<g data-outfit-layer></g>
						<g data-wig-layer></g>
						<g class="cat-head">
							<path class="cat-ear" d="M65 101 72 43 111 80Z" />
							<path class="cat-ear-inner" d="M75 83 78 57 96 78Z" />
							<path class="cat-ear" d="m134 80 37-38 5 60Z" />
							<path class="cat-ear-inner" d="m148 77 17-18 2 28Z" />
							<ellipse class="cat-face" cx="120" cy="112" rx="62" ry="52" />
							<g class="cat-face-stripes" aria-hidden="true"><path d="M76 89q11 4 18 15M101 66q7 12 7 25M164 89q-11 4-18 15M139 66q-7 12-7 25" /></g>
							<g class="cat-eyes-open"><ellipse cx="96" cy="111" rx="8" ry="12" /><ellipse cx="144" cy="111" rx="8" ry="12" /><circle class="cat-eye-glint" cx="98" cy="107" r="2.5" /><circle class="cat-eye-glint" cx="146" cy="107" r="2.5" /></g>
							<g class="cat-eyes-closed"><path d="M87 113q9 9 18 0M135 113q9 9 18 0" /></g>
							<path class="cat-muzzle" d="M109 128q11 12 22 0q-11-7-22 0Z" />
							<path class="cat-mouth" d="M120 137q-7 9-14 2m14-2q7 9 14 2" />
							<path class="cat-whiskers" d="m69 124-27-6m28 14-30 3m131-11 27-6m-28 14 30 3" />
						</g>
					</svg>
				</button>
				<div class="pet-phrase" data-pet-phrase aria-live="polite">Toca al gatito</div>
			</div>
			<div class="pet-actions">
				<button type="button" data-pet-action="food"><span aria-hidden="true">◉</span>Comida</button>
				<button type="button" data-pet-action="look"><span aria-hidden="true">◇</span>Cambiar look</button>
				<button type="button" data-pet-action="coat"><span aria-hidden="true">◌</span>Cambiar pelaje</button>
				<button type="button" data-pet-action="shop"><span aria-hidden="true">＋</span>Tienda</button>
				<button type="button" data-pet-action="play"><span aria-hidden="true">✳</span>Jugar</button>
				<button type="button" data-pet-action="sleep"><span aria-hidden="true">Zz</span>Dormir</button>
				<button type="button" data-pet-action="code"><span aria-hidden="true">⌘</span>Código</button>
			</div>
			<div class="pet-overlay" data-pet-panel hidden>
				<section class="pet-sheet" role="dialog" aria-modal="true" aria-labelledby="petPanelTitle">
					<header><h3 id="petPanelTitle" data-pet-panel-title></h3><button type="button" data-pet-close aria-label="Cerrar">×</button></header>
					<div class="pet-panel-content" data-pet-panel-content></div>
				</section>
			</div>
			<div class="pet-flight-game" data-flight-game hidden>
				<div class="flight-header"><button type="button" data-flight-exit>Salir</button><div><span>PUNTOS</span><strong data-flight-score>0</strong></div><div><span>MONEDAS</span><strong data-flight-coins>0</strong></div></div>
				<div class="flight-stage" data-flight-stage role="button" tabindex="0" aria-label="Toca para hacer subir el avioncito">
					<div class="flight-world" data-flight-world></div>
					<svg class="flight-plane" data-flight-plane viewBox="0 0 120 82" aria-hidden="true"><path class="flight-wing" d="M12 40h96l-11 13H24Z"/><path class="flight-body" d="M18 37h79q9 0 13 5-4 5-13 5H18l-9-5Z"/><path class="flight-tail" d="M30 37 19 22h22l15 15m26 0 11-13h13L99 37"/><path class="flight-cat-ears" d="m62 41 1-10 8 6m-1 4 8-7 2 11Z"/><ellipse class="flight-cat-face" cx="70" cy="43" rx="10" ry="8"/><circle class="flight-cat-eye" cx="67" cy="42" r="1.4"/><circle class="flight-cat-eye" cx="74" cy="42" r="1.4"/><path class="flight-prop" d="M110 34v16"/></svg>
					<div class="flight-ready" data-flight-ready>Toca para volar</div>
					<section class="flight-result" data-flight-result hidden><h3>Vuelo terminado</h3><p>Puntuación <strong data-result-score>0</strong></p><p>Monedas conseguidas <strong data-result-coins>0</strong></p><div><button type="button" data-flight-retry>Reintentar</button><button type="button" data-flight-return>Volver a Mascota</button></div></section>
				</div>
			</div>
		</div>
	</template>
	<audio id="musicAudio" preload="metadata" hidden></audio>
	<script src="script.js"></script>
</body>
</html>
